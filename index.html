<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebImage Suite Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="libs/jszip.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="top-bar">
            <div class="logo">WebImage Suite <span>PRO</span></div>
            <div class="menu-actions">
                <button id="btn-open" class="btn">Open Image</button>
                <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
                <button id="btn-export" class="btn btn-primary">Export Current</button>
                <button id="btn-batch" class="btn btn-secondary">Batch Processing (ZIP)</button>
            </div>
        </header>

        <div class="workspace">
            <aside class="toolbar">
                <button class="tool-btn active" title="Move / Select">✋</button>
                <button class="tool-btn" title="Crop (Not implemented)">✂️</button>
                <button class="tool-btn" title="Rotate Left" id="btn-rotate-l">↺</button>
                <button class="tool-btn" title="Rotate Right" id="btn-rotate-r">↻</button>
                <button class="tool-btn" title="Flip Horizontal" id="btn-flip-h">↔</button>
                <button class="tool-btn" title="Flip Vertical" id="btn-flip-v">↕</button>
            </aside>

            <main class="canvas-container" id="drop-zone">
                <div class="canvas-wrapper">
                    <canvas id="main-canvas"></canvas>
                </div>
                <div id="welcome-msg" class="welcome-msg">
                    <h2>Drag your images here</h2>
                    <p>Or paste from the clipboard (Ctrl+V)</p>
                </div>
            </main>

            <aside class="properties-panel">
                <h3>Settings</h3>
                
                <div class="control-group">
                    <label>Brightness <span id="val-brightness">100%</span></label>
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </div>
                
                <div class="control-group">
                    <label>Contrast <span id="val-contrast">100%</span></label>
                    <input type="range" id="contrast" min="0" max="200" value="100">
                </div>

                <div class="control-group">
                    <label>Saturation <span id="val-saturation">100%</span></label>
                    <input type="range" id="saturation" min="0" max="200" value="100">
                </div>
                
                <div class="control-group">
                    <label>Blur <span id="val-blur">0px</span></label>
                    <input type="range" id="blur" min="0" max="20" value="0" step="0.5">
                </div>

                <div class="control-group">
                    <label>Reverse <span id="val-invert">0%</span></label>
                    <input type="range" id="invert" min="0" max="100" value="0">
                </div>

                <button id="btn-reset" class="btn btn-block" style="margin-top: 15px;">Reset settings</button>

                <hr style="border-color: #333; margin: 20px 0;">

                <h3>Export</h3>
                <div class="control-group">
                    <label>Output format</label>
                    <select id="export-format">
                        <option value="image/jpeg">JPEG (.jpg)</option>
                        <option value="image/png" selected>PNG (.png)</option>
                        <option value="image/webp">WEBP (.webp)</option>
		    </select>
                </div>
		<div class="control-group">
    		    <label>Resize width (px)</label>
    		    <input type="number" id="resize-width" placeholder="Original size">
		</div>
                <div class="control-group">
                    <label>Quality (JPG/WEBP) <span id="val-quality">90%</span></label>
                    <input type="range" id="quality" min="10" max="100" value="90">
                </div>
            </aside>
        </div>
        
        <footer class="status-bar">
            <span id="status-info">Done. Waiting image...</span>
            <span id="resolution-info">0 x 0 px</span>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
