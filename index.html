<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebImage Suite Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- En un entorno 100% offline, descarga jszip.min.js y cambia esta ruta a src="libs/jszip.min.js" -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menú Superior -->
        <header class="top-bar">
            <div class="logo">WebImage Suite <span>PRO</span></div>
            <div class="menu-actions">
                <button id="btn-open" class="btn">Abrir Imagen</button>
                <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
                <button id="btn-export" class="btn btn-primary">Exportar Actual</button>
                <button id="btn-batch" class="btn btn-secondary">Procesamiento por Lote (ZIP)</button>
            </div>
        </header>

        <div class="workspace">
            <!-- Barra de Herramientas Izquierda -->
            <aside class="toolbar">
                <button class="tool-btn active" title="Mover / Seleccionar">✋</button>
                <button class="tool-btn" title="Recortar (Próximamente)">✂️</button>
                <button class="tool-btn" title="Rotar Izquierda" id="btn-rotate-l">↺</button>
                <button class="tool-btn" title="Rotar Derecha" id="btn-rotate-r">↻</button>
                <button class="tool-btn" title="Voltear Horizontal" id="btn-flip-h">↔</button>
                <button class="tool-btn" title="Voltear Vertical" id="btn-flip-v">↕</button>
            </aside>

            <!-- Área Central del Canvas -->
            <main class="canvas-container" id="drop-zone">
                <div class="canvas-wrapper">
                    <canvas id="main-canvas"></canvas>
                </div>
                <div id="welcome-msg" class="welcome-msg">
                    <h2>Arrastra tus imágenes aquí</h2>
                    <p>O pega desde el portapapeles (Ctrl+V)</p>
                </div>
            </main>

            <!-- Panel de Propiedades Derecho -->
            <aside class="properties-panel">
                <h3>Ajustes de Imagen</h3>
                
                <div class="control-group">
                    <label>Brillo <span id="val-brightness">100%</span></label>
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </div>
                
                <div class="control-group">
                    <label>Contraste <span id="val-contrast">100%</span></label>
                    <input type="range" id="contrast" min="0" max="200" value="100">
                </div>

                <div class="control-group">
                    <label>Saturación <span id="val-saturation">100%</span></label>
                    <input type="range" id="saturation" min="0" max="200" value="100">
                </div>
                
                <div class="control-group">
                    <label>Desenfoque (Blur) <span id="val-blur">0px</span></label>
                    <input type="range" id="blur" min="0" max="20" value="0" step="0.5">
                </div>

                <div class="control-group">
                    <label>Invertir <span id="val-invert">0%</span></label>
                    <input type="range" id="invert" min="0" max="100" value="0">
                </div>

                <button id="btn-reset" class="btn btn-block" style="margin-top: 15px;">Resetear Ajustes</button>

                <hr style="border-color: #333; margin: 20px 0;">

                <h3>Exportación</h3>
                <div class="control-group">
                    <label>Formato de Salida</label>
                    <select id="export-format">
                        <option value="image/jpeg">JPEG (.jpg)</option>
                        <option value="image/png" selected>PNG (.png)</option>
                        <option value="image/webp">WEBP (.webp)</option>
		    </select>
                </div>
                <div class="control-group">
                    <label>Calidad (JPG/WEBP) <span id="val-quality">90%</span></label>
                    <input type="range" id="quality" min="10" max="100" value="90">
                </div>
                <div class="control-group">
                    <label>Redimensionar Ancho (px)</label>
                    <input type="number" id="resize-width" placeholder="Ancho original">
                </div>
            </aside>
        </div>
        
        <!-- Barra de estado -->
        <footer class="status-bar">
            <span id="status-info">Listo. Esperando imagen...</span>
            <span id="resolution-info">0 x 0 px</span>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
